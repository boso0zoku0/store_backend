services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_store
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_store
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - postgres

  # Настроить AMQPS
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_store
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10


  nginx:
    image: nginx:1.30-alpine
    container_name: nginx_store
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:rw
      - ./static/media:/static/media:rw
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    restart: unless-stopped


  certbot:
    image: certbot/certbot:latest
    container_name: certbot_store
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  redis:
    image: redis:7-alpine
    container_name: redis_store
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]   # команда проверки
      interval: 20s                         # как часто проверять
      timeout: 5s                           # таймаут проверки
      retries: 5                            # сколько раз повторить

  backend_app:
    build: .
    container_name: backend_app
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
    #    Временно открыл порты для проверки работы вебсокетов
    ports:
      - "8000:8000"
  frontend_app:
    build:
      context: ../frontend           # Указал где искать Dockerfile, для бэка не надо потому что в текущей папке
    container_name: frontend_app
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
    restart: unless-stopped


volumes:
  pgdata:
  redis_data:







