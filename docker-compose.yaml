
services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_store
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_store
    env_file:
      - .env
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - postgres

# Настроить AMQPS
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_store
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"


  nginx:
    image: nginx:1.30-alpine
    container_name: nginx_store
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:rw
      - ./static/media:/static/media:rw
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    depends_on:
      - backend-app
    restart: unless-stopped


  certbot:
    image: certbot/certbot:latest
    container_name: certbot_store
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"


  backend-app:
    build: .
    container_name: backend_app
    env_file:
      - .env
  frontend-app:
    build:
      context: ../frontend           # Указал где искать Dockerfile, для бэка не надо потому что в текущей папке
    container_name: frontend_app
    restart: unless-stopped


volumes:
  pgdata:







